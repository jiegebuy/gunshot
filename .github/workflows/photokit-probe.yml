name: PhotoKit diagnostic probe
on:
  push:
    paths:
      - 'experiments/photokit/**'
      - 'UI/GSPhotoKitCache.*'
      - 'UI/GSPhotoKitTaskContext.swift'
      - 'UI/GSPhotoKitRangeSource.*'
      - 'UI/GSPhotoKitRangePump.*'
      - '.github/workflows/photokit-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Range ordering and cancellation
        run: |
          mkdir -p .build
          clang -O1 -g -fobjc-arc -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=address -framework Foundation UI/GSPhotoKitRangePump.m tests/photo_range_pump.m -o .build/photo-range-test
          .build/photo-range-test
      - name: Build standalone diagnostic app
        run: bash experiments/photokit/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: photokit-probe
          path: .build/photokit-probe/PhotoKitProbe_UNSIGNED.ipa
          if-no-files-found: error
