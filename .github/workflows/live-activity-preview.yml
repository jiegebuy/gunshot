name: Live Activity preview
on:
  workflow_dispatch:
  push:
    branches: [codex/live-upload-progress]
    paths:
      - 'LiveActivity/**'
      - 'tests/live_activity_preview.swift'
      - 'tests/live_activity_lockscreen.swift'
      - 'tests/upload_activity_state.swift'
      - 'scripts/*live-activity*'
      - '.github/workflows/live-activity-preview.yml'
permissions:
  contents: read
jobs:
  visual:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build device framework and widget
        run: bash scripts/build-live-activity.sh
      - name: Verify measured data and render all file tiles
        timeout-minutes: 15
        run: bash scripts/test-live-activity-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-activity-visuals
          include-hidden-files: true
          path: |
            packages/jailed/live-activity/
            .build/live-activity-ui/result.txt
            .build/live-activity-ui/live-activity-preview.png
            .build/live-activity-ui/lockscreen-screenshots/
            .build/live-activity-ui/lockscreen-test.log
            .build/live-activity-ui/renderer.log
          if-no-files-found: warn
