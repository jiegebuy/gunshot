name: Live Activity preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build device framework and widget
        run: bash scripts/build-live-activity.sh
      - name: Verify measured data and render all file tiles
        timeout-minutes: 10
        run: bash scripts/test-live-activity-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-activity-visuals
          path: |
            packages/jailed/live-activity/
            .build/live-activity-ui/result.txt
            .build/live-activity-ui/live-activity-preview.png
          if-no-files-found: warn
